<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- `type` and `sizes="any"` together stop a Chromium browser from preferring its
		     own /favicon.ico probe over the declared SVG. -->
		<link rel="icon" type="image/svg+xml" sizes="any" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preload" href="%sveltekit.assets%/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/barlow-condensed-500-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/fragment-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Resolve the theme before first paint. A supervision window sits beside a
			// dark terminal; a white flash at 1am is a defect, not a nicety.
			try {
				var t = localStorage.getItem('herdsman-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {
				/* private mode, blocked storage: the system preference still applies */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<!--
		Emission-Line Rail (redesign 2026-10). The direction contract lives in
		notes/ui/redesign-202610/plan.md and the persisted surface brief for
		src/routes/+layout.svelte; the system spec is notes/ui/redesign-202610/design-system.md.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
