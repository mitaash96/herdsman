<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule — Graph & Lanes</title>
<style>
/* Shared identity — carried over from the approved Contention design. */
:root {
  --bg: #f7f9f8; --panel: #fff; --well: #eef2f1; --sunk: #e5ebe9;
  --ink: #10201c; --muted: #4f6862; --faint: #839993;
  --rule: #d6e0dd; --rule2: #bccac6;
  --ember: #c05a1e; --cool: #4d7f88; --hot: #a8331f;
  --ok: #3f7d5c; --ready: #4d7f88; --review: #c08b1e; --blocked: #8b9c98;
  --crit: #a8331f;
  --shadow: 0 1px 2px rgba(16,32,28,.06), 0 10px 30px -18px rgba(16,32,28,.4);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1211; --panel: #121a18; --well: #0f1716; --sunk: #0a100f;
    --ink: #d6e4df; --muted: #8aa39c; --faint: #5e7873;
    --rule: #1f2c29; --rule2: #2e3f3b;
    --ember: #e0873a; --cool: #5b93a0; --hot: #d4523a;
    --ok: #5fa37c; --ready: #5b93a0; --review: #d9a441; --blocked: #4e625e;
    --crit: #d4523a;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="light"] {
  --bg: #f7f9f8; --panel: #fff; --well: #eef2f1; --sunk: #e5ebe9;
  --ink: #10201c; --muted: #4f6862; --faint: #839993;
  --rule: #d6e0dd; --rule2: #bccac6;
  --ember: #c05a1e; --cool: #4d7f88; --hot: #a8331f;
  --ok: #3f7d5c; --ready: #4d7f88; --review: #c08b1e; --blocked: #8b9c98;
  --crit: #a8331f;
  --shadow: 0 1px 2px rgba(16,32,28,.06), 0 10px 30px -18px rgba(16,32,28,.4);
}
:root[data-theme="dark"] {
  --bg: #0c1211; --panel: #121a18; --well: #0f1716; --sunk: #0a100f;
  --ink: #d6e4df; --muted: #8aa39c; --faint: #5e7873;
  --rule: #1f2c29; --rule2: #2e3f3b;
  --ember: #e0873a; --cool: #5b93a0; --hot: #d4523a;
  --ok: #5fa37c; --ready: #5b93a0; --review: #d9a441; --blocked: #4e625e;
  --crit: #d4523a;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.9);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.55 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  -webkit-font-smoothing: antialiased;
}
.sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1, h2, h3, .sansf { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }

/* --- staleness banner ---------------------------------------------------- */
.stale {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 7px 18px; background: var(--well); border-bottom: 1px solid var(--rule);
  font-size: 11px; color: var(--muted);
}
.stale .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.stale.dirty .dot { background: var(--review); }
.stale code {
  background: var(--sunk); border: 1px solid var(--rule); border-radius: 3px;
  padding: 1px 6px; color: var(--ink); font-size: 10.5px;
}
.stale .grow { margin-left: auto; }
.copy {
  font: inherit; font-size: 10.5px; background: var(--panel); color: var(--muted);
  border: 1px solid var(--rule2); border-radius: 3px; padding: 3px 9px; cursor: pointer;
}
.copy:hover { color: var(--ink); border-color: var(--faint); }
.copy:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

/* --- KPI readout --------------------------------------------------------- */
.readout {
  display: flex; gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 6px; overflow: hidden;
}
.cell { background: var(--panel); padding: 11px 16px; flex: 1; min-width: 112px; }
.cell .v { font-size: 21px; font-weight: 650; letter-spacing: -.015em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cell .k { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-top: 5px; font-weight: 600; }
.cell.hot .v { color: var(--hot); }
.cell.em .v { color: var(--ember); }
.cell.ok .v { color: var(--ok); }

/* --- status vocabulary (colour + form, never colour alone) --------------- */
.st { position: relative; }
.st-done { background: var(--ok); color: #fff; }
.st-review {
  background: var(--review); color: #22190a;
  background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.22) 0 3px, transparent 3px 7px);
}
.st-ready { background: var(--ready); color: #fff; }
.st-blocked {
  background: transparent; color: var(--muted);
  border: 1px dashed var(--rule2);
}
.st-pending { background: var(--blocked); color: #fff; opacity: .55; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 3px;
  font-size: 9.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
}
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.chip.done { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.chip.review { background: color-mix(in srgb, var(--review) 18%, transparent); color: var(--review); }
.chip.ready { background: color-mix(in srgb, var(--ready) 16%, transparent); color: var(--ready); }
.chip.blocked { background: var(--well); color: var(--muted); }
.chip.crit { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }

/* --- brief reader -------------------------------------------------------- */
.brief h1, .brief h2, .brief h3 { font-size: 13px; font-weight: 650; margin: 18px 0 7px; letter-spacing: -.005em; }
.brief h1 { font-size: 15px; margin-top: 0; }
.brief p, .brief li { font-size: 12px; line-height: 1.68; color: var(--muted); }
.brief ul, .brief ol { padding-left: 19px; margin: 8px 0; }
.brief li { margin-bottom: 5px; }
.brief code { background: var(--well); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; font-size: 11px; color: var(--ink); }
.brief pre { background: var(--well); border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px; overflow: auto; margin: 10px 0; font-size: 12px; line-height: 1.5; }
.brief pre code { background: transparent; border: 0; padding: 0; font-size: inherit; }
.brief table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; }
.brief th, .brief td { border: 1px solid var(--rule); padding: 5px 8px; text-align: left; vertical-align: top; }
.brief th { background: var(--well); color: var(--ink); font-weight: 640; }
.brief strong { color: var(--ink); font-weight: 640; }
.brief hr { border: 0; border-top: 1px solid var(--rule); margin: 16px 0; }
.brief .fade { position: sticky; bottom: 0; height: 40px; margin-top: -40px; background: linear-gradient(transparent, var(--panel)); pointer-events: none; }
.brief a.src { font-size: 11px; color: var(--ember); text-decoration: none; border-bottom: 1px dotted; }

/* --- tooltip ------------------------------------------------------------- */
.tip {
  position: fixed; z-index: 90; background: var(--panel); border: 1px solid var(--rule2);
  border-radius: 5px; padding: 9px 11px; font-size: 11px; max-width: 330px;
  box-shadow: var(--shadow); pointer-events: none; opacity: 0; transition: opacity .1s;
}
.tip.on { opacity: 1; }
.tip b { color: var(--ember); }
.tip .d { color: var(--muted); margin-top: 4px; line-height: 1.5; }

.seg { display: flex; border: 1px solid var(--rule2); border-radius: 5px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 11.5px; font-weight: 600; padding: 5px 12px; border: 0;
  background: var(--panel); color: var(--muted); cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--rule2); }
.seg button[aria-pressed="true"] { background: var(--ember); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

::selection { background: color-mix(in srgb, var(--ember) 30%, transparent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.hd { padding: 15px 22px 14px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.hdtop { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 13px; }
h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.018em; }
.hdtop .p { color: var(--faint); font-size: 11px; }
.grow { margin-left: auto; }

main { padding: 20px 22px 46vh; display: flex; flex-direction: column; gap: 20px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.phd { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--rule); background: var(--well); }
.phd h2 { margin: 0; font-size: 11.5px; font-weight: 640; letter-spacing: .03em; }
.phd .hint { margin-left: auto; color: var(--faint); font-size: 10.5px; }
.scroll { overflow: auto; }
.empty { padding: 26px 20px; color: var(--faint); font-size: 11.5px; text-align: center; }
/* `.chip { display: inline-flex }` outranks the UA's `[hidden] { display: none }`,
   so an empty critical-path chip would still draw its dot. */
[hidden] { display: none !important; }

/* ---- wave DAG ---- */
.dag { position: relative; padding: 16px 20px; min-width: 900px; }
.waves { display: flex; gap: 46px; align-items: flex-start; position: relative; z-index: 2; }
.wave { display: flex; flex-direction: column; gap: 7px; min-width: 168px; }
.wlab {
  font-size: 9.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--faint);
  font-weight: 650; padding-bottom: 5px; border-bottom: 1px solid var(--rule); margin-bottom: 3px;
}
.node {
  border: 1px solid var(--rule2); border-radius: 4px; background: var(--panel);
  padding: 6px 9px; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 3px;
  border-left-width: 3px;
}
.node[data-st="done"] { border-left-color: var(--ok); }
.node[data-st="review"] { border-left-color: var(--review); }
.node[data-st="ready"] { border-left-color: var(--ready); }
.node[data-st="blocked"] { border-left-color: var(--rule2); background: var(--well); }
.node.ws { border-style: dashed; }
.node[data-crit="1"] { box-shadow: 0 0 0 1px var(--crit); }
.node:hover, .node:focus-visible { border-color: var(--ember); outline: none; z-index: 4; }
.node[data-sel="1"] { background: color-mix(in srgb, var(--ember) 13%, var(--panel)); border-color: var(--ember); }
.node .n1 { display: flex; align-items: center; gap: 6px; font-size: 10.5px; }
.node .n1 .id { color: var(--faint); }
.node .n1 .pl { color: var(--ember); font-size: 9.5px; }
.node .n1 .w { margin-left: auto; color: var(--faint); font-size: 9.5px; }
.node .n2 { font-size: 10.5px; color: var(--ink); line-height: 1.35; }
.node .n3 { display: flex; gap: 4px; align-items: center; font-size: 8.5px; color: var(--faint); }
.node.dim { opacity: .22; }
svg.edges { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: visible; }
svg.edges path { fill: none; stroke: var(--rule2); stroke-width: 1.2; }
svg.edges path.crit { stroke: var(--crit); stroke-width: 1.8; }
svg.edges path.hot { stroke: var(--ember); stroke-width: 2; }

/* ---- lanes ---- */
.lanes { min-width: 900px; }
.lane { display: flex; border-bottom: 1px solid var(--rule); }
.lane:last-child { border-bottom: 0; }
.lane:hover { background: var(--well); }
.lmeta { width: 300px; flex: none; padding: 7px 14px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; justify-content: center; overflow: hidden; }
.lname { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.lbar { display: flex; align-items: center; gap: 7px; }
.meter { flex: 1; height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; }
.lnum { font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ltrack { flex: 1; position: relative; padding: 5px 0; min-height: 30px; }
.ltrack::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px var(--tw)); opacity: .45; }
.blk { position: absolute; height: 14px; border-radius: 2px; font-size: 8.5px; display: flex; align-items: center; padding: 0 4px; overflow: hidden; white-space: nowrap; cursor: pointer; }
.blk[data-crit="1"] { box-shadow: inset 0 0 0 1.5px var(--crit); }
.blk.dim { opacity: .18; }
.axis { display: flex; border-top: 1px solid var(--rule); background: var(--well); }
.axis .pad { width: 300px; flex: none; border-right: 1px solid var(--rule); }
.axis .tk { flex: 1; position: relative; height: 20px; }
.axis .tk span { position: absolute; font-size: 9.5px; color: var(--faint); line-height: 20px; padding-left: 4px; border-left: 1px solid var(--rule2); height: 100%; font-variant-numeric: tabular-nums; }

/* ---- drawer ---- */
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0; height: 44vh; z-index: 40;
  background: var(--panel); border-top: 1px solid var(--rule2); box-shadow: var(--shadow);
  transform: translateY(100%); transition: transform .22s cubic-bezier(.4,0,.2,1), height .3s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
}
.drawer.on { transform: translateY(0); }
.dhd { display: flex; align-items: center; gap: 10px; padding: 10px 22px; border-bottom: 1px solid var(--rule); background: var(--well); }
.dhd h3 { margin: 0; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.dclose { font: inherit; background: transparent; border: 1px solid var(--rule2); color: var(--muted); border-radius: 3px; padding: 3px 10px; cursor: pointer; font-size: 11px; transition: color .15s, border-color .15s, background .15s; }
.dclose:hover { color: var(--ink); border-color: var(--faint); }
.dclose[aria-pressed="true"] { background: color-mix(in srgb, var(--ember) 14%, transparent); color: var(--ember); border-color: color-mix(in srgb, var(--ember) 40%, transparent); }

/* glass tab segment in the drawer header */
.dhd .seg {
  margin-left: 4px;
  background: color-mix(in srgb, var(--panel) 55%, transparent);
  -webkit-backdrop-filter: blur(10px) saturate(140%); backdrop-filter: blur(10px) saturate(140%);
  border: 1px solid color-mix(in srgb, var(--rule2) 55%, transparent);
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 18%, transparent), 0 1px 2px rgba(16,32,28,.05);
}
.dhd .seg:empty { display: none; }
.dhd .seg button {
  background: transparent; color: var(--muted); border: 0; transition: color .15s, background .15s;
}
.dhd .seg button:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
.dhd .seg button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--ember) 22%, transparent); color: var(--ember);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ember) 45%, transparent);
}
.dhd .seg button + button { border-left: 1px solid color-mix(in srgb, var(--rule2) 45%, transparent); }

.dbody {
  flex: 1; overflow: auto; display: grid;
  grid-template-columns: minmax(0,1fr) 260px; gap: 0;
  transition: grid-template-columns .3s cubic-bezier(.4,0,.2,1);
}
@media (max-width: 820px) { .dbody { grid-template-columns: minmax(0,1fr); } .dmeta { display: none; } }
.dmain { padding: 18px 22px; overflow: auto; }
.dmeta { border-left: 1px solid var(--rule); padding: 18px; overflow: auto; background: var(--well); opacity: 1; transition: opacity .2s; min-width: 0; }
.dmeta .h { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 650; margin: 0 0 7px; }
.dmeta a { display: block; font-size: 10.5px; color: var(--muted); padding: 3px 0; border-bottom: 1px solid var(--rule); text-decoration: none; }
.dmeta a:hover { color: var(--ember); }
.dmeta + .h { margin-top: 16px; }

.drawer.hide-meta .dbody { grid-template-columns: minmax(0,1fr) 0; }
.drawer.hide-meta .dmeta { opacity: 0; border-left: 0; padding-left: 0; padding-right: 0; overflow: hidden; }
.drawer.max { height: 100vh; }

/* sleek gradient vertical scrollbars for drawer surfaces */
.dmain, .dmeta { scrollbar-width: thin; scrollbar-color: var(--ember) transparent; }
.dmain::-webkit-scrollbar, .dmeta::-webkit-scrollbar { width: 8px; height: 8px; }
.dmain::-webkit-scrollbar-track, .dmeta::-webkit-scrollbar-track { background: transparent; }
.dmain::-webkit-scrollbar-thumb, .dmeta::-webkit-scrollbar-thumb {
  border-radius: 8px; border: 2px solid transparent; background-clip: padding-box;
  background-image: linear-gradient(var(--ember), color-mix(in srgb, var(--ember) 45%, var(--cool)));
}
.dmain::-webkit-scrollbar-thumb:hover, .dmeta::-webkit-scrollbar-thumb:hover,
.scroll::-webkit-scrollbar-thumb:hover {
  background-image: linear-gradient(color-mix(in srgb, var(--ember) 80%, #fff), var(--cool));
}

/* same sleek gradient scroll for the graphs panels */
.scroll { scrollbar-width: thin; scrollbar-color: var(--ember) transparent; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb {
  border-radius: 8px; border: 2px solid transparent; background-clip: padding-box;
  background-image: linear-gradient(var(--ember), color-mix(in srgb, var(--ember) 45%, var(--cool)));
}
</style>

<div id="stale"></div>
<div class="hd">
  <div class="hdtop">
    <h1 id="ttl"></h1>
    <span class="p" id="sub"></span>
    <span class="p" id="desc"></span>
    <span class="grow"></span>
    <span class="chip crit" id="cp" hidden></span>
  </div>
  <div class="readout" id="kpi"></div>
</div>

<main>
  <div class="panel">
    <div class="phd">
      <h2>Dependency graph</h2>
      <span class="chip done">Done</span><span class="chip review">Review</span>
      <span class="chip ready">Ready</span><span class="chip blocked">Blocked</span>
      <span class="hint">columns are dependency waves · hover to trace · click for the brief</span>
    </div>
    <div class="scroll"><div class="dag" id="dag"><svg class="edges" id="edges" aria-hidden="true"></svg><div class="waves" id="waves"></div></div></div>
  </div>

  <div class="panel">
    <div class="phd">
      <h2>Claim contention</h2>
      <span class="hint" id="lanehint">why the graph is a chain — lanes are contended paths, widest first</span>
    </div>
    <div class="scroll">
      <div class="lanes" id="lanes"></div>
      <div class="axis"><div class="pad"></div><div class="tk" id="tk"></div></div>
    </div>
  </div>
</main>

<div class="drawer" id="drawer" role="dialog" aria-label="Task brief">
  <div class="dhd">
    <h3 id="dtitle">Task brief</h3>
    <div class="seg" id="dtabs"></div>
    <span class="grow"></span>
    <button class="dclose" id="dmeta-toggle" aria-pressed="false" title="Toggle sidebar">Meta</button>
    <button class="dclose" id="dmax" aria-pressed="false" title="Maximize">Max</button>
    <button class="dclose" id="dclose">Close ✕</button>
  </div>
  <div class="dbody"><div class="dmain brief" id="dmain"></div><div class="dmeta" id="dmeta"></div></div>
</div>

<script>
__DATA__
/* Shared behaviour for all three mock-ups. */
const BY_UID = Object.fromEntries(DATA.tasks.map(t => [t.uid, t]));
const PLANNED_TASKS = DATA.tasks.filter(t => t.kind === "task");
/* Scale denominator only. A graph with nothing schedulable has span 0, and every
   percentage below divides by it — so the divisor floors at 1 while the readout
   still prints the true DATA.spans.taskLevel. */
const SPAN = DATA.spans.taskLevel || 1;
const TOTAL_EFFORT = PLANNED_TASKS.reduce((a, t) => a + t.weight, 0);
const STATUS_ORDER = ["done", "review", "ready", "blocked", "pending"];
const STATUS_LABEL = { done: "Done", review: "In review", ready: "Ready", blocked: "Blocked", pending: "Pending" };

const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* Deliberately minimal markdown — headings, lists, tables, code, fenced blocks, bold, rules. */
function md(src) {
  const lines = esc(src).split("\n");
  let out = "", list = null, pre = null, pending = null, tbl = null;
  const inline = s => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  /* Lazy continuation: a wrapped line under an open list belongs to the item above it,
     not to a new bullet. Reopen the last `</li>` and append rather than emitting one. */
  const contLi = txt => {
    if (/<\/li>$/.test(out)) out = out.slice(0, -5) + " " + txt.trim() + "</li>";
    else out += `<li>${txt}</li>`;
  };
  /* A row is a line bracketed by `|`; a separator is one whose only non-space chars are `|`,
     `:`, `-`, and which carries `--` per cell — that is, a markdown alignment row. */
  const cells = line => line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(s => s.trim());
  const aligns = sep => cells(sep).map(c => {
    if (c.startsWith(":") && c.endsWith(":")) return "center";
    if (c.endsWith(":")) return "right";
    if (c.startsWith(":")) return "left";
    return null;
  });
  const emitTable = () => {
    const head = cells(tbl.head);
    let h = "<table><thead><tr>";
    for (let i = 0; i < head.length; i++) {
      const a = tbl.aligns[i]; const st = a ? ` style="text-align:${a}"` : "";
      h += `<th${st}>${inline(head[i])}</th>`;
    }
    h += "</tr></thead><tbody>";
    for (const r of tbl.rows) {
      const cs = cells(r);
      h += "<tr>";
      for (let i = 0; i < cs.length; i++) {
        const a = tbl.aligns[i]; const st = a ? ` style="text-align:${a}"` : "";
        h += `<td${st}>${inline(cs[i])}</td>`;
      }
      h += "</tr>";
    }
    return h + "</tbody></table>";
  };
  /* Index of the line that emitted the open `<p>`, so the next line can join it
     instead of starting a new block — a newline is a soft break, not a paragraph. */
  let paraAt = -2;
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (/^\s*```/.test(raw)) {
      if (pre) { out += "</code></pre>"; pre = null; }
      else {
        if (list) { out += `</${list}>`; list = null; }
        if (pending) { out += `<p>${inline(pending)}</p>`; pending = null; }
        if (tbl) { out += emitTable(); tbl = null; }
        out += "<pre><code>"; pre = true;
      }
      continue;
    }
    if (pre) { out += raw + "\n"; continue; }
    const l = raw.trimEnd();
    const isRow = /^\s*\|.*\|\s*$/.test(l);
    const isSep = isRow && /^[\s|:-]+$/.test(l) && /-{2,}/.test(l);
    if (pending !== null) {
      if (isSep) {
        if (list) { out += `</${list}>`; list = null; }
        tbl = { head: pending, rows: [], aligns: aligns(l) };
        pending = null;
        continue;
      }
      if (list) { contLi(inline(pending)); } else { out += `<p>${inline(pending)}</p>`; }
      pending = null;
    }
    if (tbl) {
      if (isRow) { tbl.rows.push(l); continue; }
      out += emitTable(); tbl = null;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    const li = l.match(/^\s*[-*]\s+(.*)/);
    const ol = l.match(/^\s*(\d+)\.\s+(.*)/);
    if (h) { if (list) { out += `</${list}>`; list = null; } out += `<h${Math.min(h[1].length + 1, 4)}>${inline(h[2])}</h${Math.min(h[1].length + 1, 4)}>`; continue; }
    if (/^---+$/.test(l)) { if (list) { out += `</${list}>`; list = null; } out += "<hr>"; continue; }
    if (li) { if (list !== "ul") { if (list) out += `</${list}>`; out += "<ul>"; list = "ul"; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (ol) { if (list !== "ol") { if (list) out += `</${list}>`; out += "<ol>"; list = "ol"; } out += `<li>${inline(ol[2])}</li>`; continue; }
    if (!l.trim()) { if (list) { out += `</${list}>`; list = null; } continue; }
    if (isRow) { pending = l; continue; }
    if (list) { contLi(inline(l)); continue; }
    if (paraAt === i - 1 && /<\/p>$/.test(out)) out = out.slice(0, -4) + " " + inline(l).trim() + "</p>";
    else out += `<p>${inline(l)}</p>`;
    paraAt = i;
  }
  if (list) out += `</${list}>`;
  if (pending) out += `<p>${inline(pending)}</p>`;
  if (pre) out += "</code></pre>";
  if (tbl) out += emitTable();
  return out;
}

function briefHTML(t) {
  const badges = t.kind === "workstream"
    ? '<span class="chip blocked">not planned</span>'
    : `<span class="chip ${t.status}">${STATUS_LABEL[t.status]}</span>
      ${t.critical ? '<span class="chip crit">Critical path</span>' : ""}
      <span class="chip blocked">${t.complexity} · ${t.effort}</span>`;
  return `<h1>${esc(t.id)} · ${esc(t.title)}</h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px">${badges}</div>
    ${md(t.brief || "_No document body found._")}
    <hr><a class="src" href="#" onclick="return false">${esc(t.path || "")}</a>`;
}

function claimRows(limit) {
  return Object.entries(DATA.claims).map(([path, uids]) => ({
    path, uids, load: uids.reduce((a, u) => a + BY_UID[u].weight, 0)
  })).sort((a, b) => b.load - a.load || b.uids.length - a.uids.length).slice(0, limit);
}

function staleBanner(host) {
  const g = DATA.gen;
  host.className = "stale" + (g.dirty ? " dirty" : "");
  host.innerHTML = `<span class="dot"></span>
    <span>Snapshot of <code>${g.branch}</code> at <code>${g.sha}</code>${g.dirty ? " · working tree dirty" : ""}</span>
    <span style="color:var(--faint)">${new Date(g.at).toLocaleString()}</span>
    <span class="grow"></span>
    <span style="color:var(--faint)">Static file — re-run to refresh</span>
    <button class="copy" id="cpcmd">Copy refresh command</button>`;
  host.querySelector("#cpcmd").onclick = e => {
    const cmd = `python3 scripts/schedule_view.py ${DATA.gen.initiative || "docs/2026-08-03-herdsman-teardown"}`;
    navigator.clipboard?.writeText(cmd);
    e.target.textContent = "Copied";
    setTimeout(() => { e.target.textContent = "Copy refresh command"; }, 1600);
  };
}

function tooltip() {
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  return {
    show(html) { tip.innerHTML = html; tip.classList.add("on"); },
    hide() { tip.classList.remove("on"); },
    move(e) {
      if (!tip.classList.contains("on")) return;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + "px";
      tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 10) + "px";
    }
  };
}

function taskTip(t) {
  if (t.kind === "workstream") {
    return `<b>${esc(t.id)} · ${esc(t.title)}</b><div class="d">not planned<br>${t.depends.length} declared dependenc${t.depends.length === 1 ? "y" : "ies"}</div>`;
  }
  return `<b>${esc(t.id)} · ${esc(t.title)}</b>
    <div class="d">${esc(t.plan)}<br>${STATUS_LABEL[t.status]} · ${t.complexity} · ${t.effort} effort${t.critical ? " · on critical path" : ""}
    <br>${t.s === null ? "unscheduled" : `units ${t.s}–${t.e}`} · ${t.claims.length} claim${t.claims.length === 1 ? "" : "s"}</div>`;
}

/* Children index, built once — the graph is small and never changes at runtime. */
const CHILDREN = {};
DATA.tasks.forEach(t => t.depends.forEach(d => (CHILDREN[d] ||= []).push(t.uid)));

/* Everything reachable from a task in either direction: its whole chain,
   end to end, not just the tasks touching it. */
function lineage(uid) {
  const seen = new Set([uid]);
  const walk = (u, next) => next(u).forEach(v => {
    if (v in BY_UID && !seen.has(v)) { seen.add(v); walk(v, next); }
  });
  walk(uid, u => BY_UID[u].depends);
  walk(uid, u => CHILDREN[u] || []);
  return seen;
}

/* Dependency waves: level(t) = 1 + max(level(deps)). Used by the DAG views. */
function waves() {
  const lvl = {};
  const depth = u => {
    if (u in lvl) return lvl[u];
    if (BY_UID[u].kind === "workstream") return (lvl[u] = BY_UID[u].wave);
    lvl[u] = 0;
    const ds = BY_UID[u].depends.filter(d => d in BY_UID);
    lvl[u] = ds.length ? 1 + Math.max(...ds.map(depth)) : 0;
    return lvl[u];
  };
  DATA.tasks.forEach(t => depth(t.uid));
  const cols = [];
  for (const t of DATA.tasks) (cols[lvl[t.uid]] ||= []).push(t);
  // A cycle pins its members to the sentinel level and can leave level 0 empty,
  // so the array is sparse. filter() drops holes; an empty graph yields [].
  return cols.filter(Boolean);
}

const TIP = tooltip();
addEventListener("mousemove", e => TIP.move(e));
let sel = null;
staleBanner(document.getElementById("stale"));

/* ---------- header ---------- */
/* Lanes are needed here as well as below: the "locked on one file" figure is the
   heaviest lane's load, so the rows are built once, before the readout. */
const rows = claimRows(12);
const hottest = rows.length ? rows[0].load : 0;
const maxLoad = hottest || 1;
const critTasks = PLANNED_TASKS.filter(t => t.critical);
const critUnits = critTasks.reduce((a, t) => a + t.weight, 0);
const serial = DATA.spans.planSerial;
const delta = serial ? Math.round((DATA.spans.taskLevel - serial) / serial * 100) : null;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

document.title = `${DATA.title || "Schedule"} — Graph & Lanes`;
document.getElementById("ttl").textContent = DATA.title || "Untitled initiative";
document.getElementById("sub").textContent =
  `${DATA.gen.initiative} · ${plural(DATA.plans.length, "plan")} · ${plural(PLANNED_TASKS.length, "task")}`;
document.getElementById("desc").textContent = DATA.desc || "";
if (critTasks.length) {
  const cp = document.getElementById("cp");
  cp.hidden = false;
  cp.textContent = `Critical path ${critTasks.length} · ${critUnits}u`;
}

const sc = DATA.statusCounts;
const coverage = `${DATA.coverage.planned} of ${DATA.coverage.total} workstreams planned`;
document.getElementById("kpi").innerHTML = `
  <div class="cell ok"><div class="v">${sc.done || 0}/${PLANNED_TASKS.length}</div><div class="k">Tasks done</div></div>
  <div class="cell"><div class="v">${DATA.spans.partial ? "≥ " : ""}${DATA.spans.taskLevel}</div><div class="k">Makespan (u)${DATA.spans.partial ? ` · ${coverage}` : ""}</div></div>
  <div class="cell hot"><div class="v">${hottest}</div><div class="k">Locked on one file</div></div>
  <div class="cell em"><div class="v">${delta === null ? "—" : (delta > 0 ? "+" : delta < 0 ? "−" : "") + Math.abs(delta) + "%"}</div><div class="k">vs plan-serial</div></div>
  <div class="cell"><div class="v">${sc.ready || 0}</div><div class="k">Ready now</div></div>
  <div class="cell"><div class="v">${sc.blocked || 0}</div><div class="k">Blocked</div></div>`;

/* ---------- wave DAG ---------- */
const cols = waves();
const wavesEl = document.getElementById("waves");
if (DATA.spans.partial) {
  document.getElementById("lanehint").textContent = `Claims from planned tasks only · ${coverage}`;
}
cols.forEach((ts, i) => {
  const w = document.createElement("div");
  w.className = "wave";
  w.innerHTML = `<div class="wlab">Wave ${i} · ${ts.length}</div>`;
  for (const t of ts) {
    const n = document.createElement("div");
    n.className = "node" + (t.kind === "workstream" ? " st st-blocked ws" : "");
    n.tabIndex = 0;
    n.dataset.uid = t.uid;
    n.dataset.st = t.status;
    n.dataset.crit = t.critical ? "1" : "0";
    const plan = t.kind === "workstream" ? "WS" : t.plan.slice(0, 3);
    const effort = t.kind === "workstream" ? "" : (t.effort[0] || "?").toUpperCase();
    const badge = t.kind === "workstream" ? "not planned" : (STATUS_LABEL[t.status] || t.status);
    n.innerHTML = `<div class="n1"><span class="pl">${esc(plan)}</span><span class="id">${esc(t.id)}</span><span class="w">${esc(effort)}</span></div>
      <div class="n2">${esc(t.title.length > 42 ? t.title.slice(0, 40) + "…" : t.title)}</div>
      <div class="n3"><span class="chip ${t.status}" style="padding:1px 5px;font-size:8px">${badge}</span>${t.critical ? '<span style="color:var(--crit)">▲ critical</span>' : ""}</div>`;
    n.onclick = () => open(t.uid);
    n.onkeydown = e => { if (e.key === "Enter") open(t.uid); };
    w.appendChild(n);
  }
  wavesEl.appendChild(w);
});
if (!cols.length) {
  document.getElementById("dag").insertAdjacentHTML(
    "beforeend",
    '<div class="empty">No tasks found — this initiative has no plan carrying a task index.</div>'
  );
}

const nodeEl = uid => document.querySelector(`.node[data-uid="${CSS.escape(uid)}"]`);
function drawEdges(chain) {
  const svg = document.getElementById("edges");
  const dag = document.getElementById("dag");
  svg.innerHTML = "";
  svg.setAttribute("width", dag.scrollWidth);
  svg.setAttribute("height", dag.scrollHeight);
  const box = dag.getBoundingClientRect();
  // Built as markup rather than createElementNS: innerHTML on an <svg> element
  // already parses in the SVG namespace, so the paths need no namespace URI —
  // which is also the only string in this file that looked like a network fetch.
  const paths = [];
  for (const t of DATA.tasks) {
    for (const d of t.depends) {
      const A = nodeEl(d), B = nodeEl(t.uid);
      if (!A || !B) continue;
      const ra = A.getBoundingClientRect(), rb = B.getBoundingClientRect();
      const x1 = ra.right - box.left, y1 = ra.top - box.top + ra.height / 2;
      const x2 = rb.left - box.left, y2 = rb.top - box.top + rb.height / 2;
      const mid = (x1 + x2) / 2;
      // An edge lights up only when both ends sit in the hovered chain.
      const isHot = chain && chain.has(t.uid) && chain.has(d);
      const isCrit = BY_UID[d].critical && t.critical;
      paths.push(`<path d="M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}"`
        + ` class="${isHot ? "hot" : isCrit ? "crit" : ""}"`
        + `${chain && !isHot ? ' opacity=".15"' : ""}/>`);
    }
  }
  svg.innerHTML = paths.join("");
}

/* ---------- lanes ---------- */
const lanesEl = document.getElementById("lanes");
lanesEl.style.setProperty("--tw", (100 / SPAN * 4) + "%");
for (const L of rows) {
  const f = L.load / maxLoad;
  const col = f > .72 ? "var(--hot)" : f > .38 ? "var(--ember)" : "var(--cool)";
  const lane = document.createElement("div");
  lane.className = "lane";
  lane.innerHTML = `<div class="lmeta"><div class="lname" title="${esc(L.path)}">&#8206;${esc(L.path)}</div>
    <div class="lbar"><div class="meter"><i style="width:${Math.min(100, L.load / SPAN * 100)}%;background:${col}"></i></div>
    <span class="lnum">${L.uids.length}t·${L.load}u·${Math.round(L.load / SPAN * 100)}%</span></div></div><div class="ltrack"></div>`;
  const track = lane.querySelector(".ltrack");
  const ends = [];
  for (const u of L.uids.slice().sort((a, b) => (BY_UID[a].s ?? Infinity) - (BY_UID[b].s ?? Infinity))) {
    const t = BY_UID[u];
    if (t.s === null) continue;  // never became dispatchable: it has no place on the axis
    let r = ends.findIndex(e => e <= t.s);
    if (r === -1) { ends.push(0); r = ends.length - 1; }
    ends[r] = t.e;
    const b = document.createElement("div");
    b.className = "blk st st-" + t.status;
    b.tabIndex = 0;
    b.dataset.uid = u;
    b.dataset.crit = t.critical ? "1" : "0";
    b.style.cssText += `left:${t.s / SPAN * 100}%;width:${t.weight / SPAN * 100}%;top:${5 + r * 17}px`;
    b.textContent = t.plan.slice(1, 3) + "·" + t.id;
    b.onclick = () => open(u);
    track.appendChild(b);
  }
  track.style.minHeight = (10 + Math.max(1, ends.length) * 17) + "px";
  lanesEl.appendChild(lane);
}
if (!rows.length) {
  lanesEl.innerHTML = `<div class="empty">${PLANNED_TASKS.length ? "No task in this initiative claims a source path." : "No tasks found — nothing claims a path."}</div>`;
}
const tk = document.getElementById("tk");
for (let u = 0; u <= SPAN; u += 4) tk.innerHTML += `<span style="left:${u / SPAN * 100}%">${u}</span>`;

/* ---------- drawer ---------- */
const drawer = document.getElementById("drawer");
function open(uid) {
  sel = uid;
  const t = BY_UID[uid];
  document.getElementById("dtitle").textContent = `${t.kind === "workstream" ? "Workstream" : t.plan} / ${t.id}`;
  const views = { brief: briefHTML(t) };
  const tabLabels = [{ key: "brief", label: "Brief" }];
  if (t.kind === "task" && t.status === "done") {
    for (const [key, label] of [["diff", "Review"], ["verdict", "Verdict"]]) {
      const artifact = t[key];
      if (!artifact) continue;
      views[key] = `${md(artifact.body)}<hr><a class="src" href="#" onclick="return false">${esc(artifact.path)}</a>`;
      tabLabels.push({ key, label });
    }
  }
  const dmain = document.getElementById("dmain");
  const dtabs = document.getElementById("dtabs");
  dtabs.innerHTML = tabLabels.map((tab, i) =>
    `<button type="button" data-tab="${tab.key}" aria-pressed="${i === 0}">${tab.label}</button>`).join("");
  dmain.innerHTML = `<div id="dcontent"></div>`;
  const content = document.getElementById("dcontent");
  const selectTab = key => {
    content.innerHTML = views[key];
    dtabs.querySelectorAll("[data-tab]").forEach(button => {
      button.setAttribute("aria-pressed", String(button.dataset.tab === key));
    });
    dmain.scrollTop = 0;
  };
  dtabs.querySelectorAll("[data-tab]").forEach(button => {
    button.onclick = () => selectTab(button.dataset.tab);
  });
  selectTab("brief");
  const dependencies = t.depends.map(d => {
    const dep = BY_UID[d];
    return `<a href="#" onclick="return false">${esc(dep ? `${dep.id} — ${dep.title.slice(0, 26)}` : d)}</a>`;
  }).join("") || '<div style="font-size:11px;color:var(--faint)">nothing</div>';
  document.getElementById("dmeta").innerHTML = `
    <div class="h">Claims (${t.claims.length})</div>
    ${t.claims.map(c => `<a href="#" onclick="return false">${esc(c)}<span style="float:right;color:var(--faint)">${(DATA.claims[c] || []).length}</span></a>`).join("") || '<div style="font-size:11px;color:var(--faint)">none</div>'}
    <div class="h" style="margin-top:16px">${t.kind === "workstream" ? "Declared dependencies" : "Waits on"} (${t.depends.length})</div>
    ${dependencies}
    <div class="h" style="margin-top:16px">Schedule</div>
    <div style="font-size:11px;color:var(--muted);line-height:1.7">${t.kind === "workstream"
      ? "not planned — no task schedule or contention bars"
      : t.s === null
        ? "never becomes dispatchable — it is not on either schedule"
        : `units ${t.s}–${t.e}<br>plan-serial ${t.ps === null ? "—" : `${t.ps}–${t.pe}`}` +
          `<br>pulled forward ${t.ps === null ? "—" : (t.ps - t.s) + "u"}`}</div>`;
  drawer.classList.add("on");
  document.querySelectorAll(".node").forEach(n => n.dataset.sel = n.dataset.uid === uid ? "1" : "0");
  document.getElementById("dmain").scrollTop = 0;
}
document.getElementById("dclose").onclick = () => { drawer.classList.remove("on"); document.querySelectorAll(".node").forEach(n => n.dataset.sel = "0"); };
document.getElementById("dmeta-toggle").onclick = function() {
  const on = drawer.classList.toggle("hide-meta");
  this.setAttribute("aria-pressed", String(on));
};
document.getElementById("dmax").onclick = function() {
  const on = drawer.classList.toggle("max");
  this.setAttribute("aria-pressed", String(on));
};
addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("dclose").click(); });

/* ---------- linked hover ---------- */
document.addEventListener("mouseover", e => {
  const el = e.target.closest(".node,.blk");
  if (!el) return;
  const t = BY_UID[el.dataset.uid];
  const chain = lineage(t.uid);
  TIP.show(taskTip(t) + `<div class="d" style="color:var(--ember)">chain: ${chain.size} tasks end to end</div>`);
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("dim", !chain.has(n.dataset.uid)));
  document.querySelectorAll(".blk").forEach(b => b.classList.toggle("dim", !chain.has(b.dataset.uid)));
  drawEdges(chain);
});
document.addEventListener("mouseout", e => {
  if (!e.target.closest(".node,.blk")) return;
  TIP.hide();
  document.querySelectorAll(".node").forEach(n => n.classList.remove("dim"));
  document.querySelectorAll(".blk").forEach(b => b.classList.remove("dim"));
  drawEdges();
});

requestAnimationFrame(() => drawEdges());
addEventListener("resize", () => drawEdges());
</script>
