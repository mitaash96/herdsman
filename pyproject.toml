[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herdsman"
version = "0.0.1"
description = "Meta-harness orchestrating AI agent CLIs"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "networkx>=3.6.1",
    "pydantic>=2.9",
    "typer>=0.15",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Aider's pinned runtime currently supports Python <3.13 and networkx 3.4;
# keep the verified RepoMap pin opt-in on compatible interpreters only.
repomap = ["aider-chat==0.86.2; python_version < '3.13'"]

[project.scripts]
herdsman = "herdsman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["herdsman"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "herdsman/assets"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=9.1.1",
]
